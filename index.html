<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baraja de Cartas</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    h1 { text-align: center; }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .players {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .player {
      background: white;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      display: none;
    }
    .player.visible {
      display: block;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 15px;
    }
    .card img {
      width: 100%;
      max-width: 180px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      min-height: 250px;
      object-fit: cover;
    }
    .card button {
      margin-top: 8px;
      background: crimson;
      border: none;
      padding: 6px 12px;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <h1>Baraja de Cartas</h1>
  <div class="buttons">
    <button onclick="repartirCartas()">Repartir Cartas</button>
    <button onclick="verJugador(1)">Ver Jugador 1</button>
    <button onclick="verJugador(2)">Ver Jugador 2</button>
  </div>
  <div class="players">
    <div class="player" id="jugador1">
      <h2>Jugador 1</h2>
    </div>
    <div class="player" id="jugador2">
      <h2>Jugador 2</h2>
    </div>
  </div>

  <script>
    let cartas = [];
    let mazo1 = [];
    let mazo2 = [];
    let jugadorVisible = 0;
    const dorso = "https://upload.wikimedia.org/wikipedia/commons/thumb/5/54/Card_back_01.svg/200px-Card_back_01.svg.png";

    async function cargarCartas() {
      const url = 'https://docs.google.com/spreadsheets/d/1n4N1HTVmJ8oK1-3jd7OrJGgxBDubIOHHbmDtAC72kAE/gviz/tq?tqx=out:csv';
      const response = await fetch(url);
      const data = await response.text();
      const rows = data.split('\n').slice(1);

      cartas = rows.map(row => {
        const [nombreRaw, imagenRaw] = row.split(',');
        const nombre = nombreRaw?.replace(/(^"|"$)/g, '').trim();
        let imagen = imagenRaw?.replace(/(^"|"$)/g, '').trim();

        const match = imagen?.match(/[-\w]{25,}/);
        if (match) {
          imagen = `https://drive.google.com/uc?export=view&id=${match[0]}`;
        }

        return nombre && imagen ? { nombre, imagen } : null;
      }).filter(Boolean);

      const guardado1 = localStorage.getItem('mazo1');
      const guardado2 = localStorage.getItem('mazo2');
      if (guardado1 && guardado2) {
        mazo1 = JSON.parse(guardado1);
        mazo2 = JSON.parse(guardado2);
        if (mazo1.length > 0 || mazo2.length > 0) {
          jugadorVisible = 1;
          verJugador(jugadorVisible);
        }
      }
    }

    function mostrarCartas(jugadorId, cartas, mostrar) {
      const contenedor = document.getElementById(jugadorId);
      contenedor.classList.add('visible');
      contenedor.innerHTML = `<h2>${jugadorId === 'jugador1' ? 'Jugador 1' : 'Jugador 2'}</h2>`;
      cartas.forEach((carta, index) => {
        const div = document.createElement('div');
        div.className = 'card';
        const imgSrc = mostrar ? carta.imagen : dorso;
        div.innerHTML = `
          <img src="${imgSrc}" alt="${carta.nombre}" onerror="this.src='${dorso}'">
          ${mostrar ? `<button onclick="descartarCarta('${jugadorId}', ${index})">Descartar</button>` : ''}
        `;
        contenedor.appendChild(div);
      });
    }

    function repartirCartas() {
      const barajadas = cartas.slice().sort(() => Math.random() - 0.5);
      const mitad = Math.ceil(barajadas.length / 2);
      mazo1 = barajadas.slice(0, mitad);
      mazo2 = barajadas.slice(mitad);
      jugadorVisible = 1;
      verJugador(jugadorVisible);

      localStorage.setItem('mazo1', JSON.stringify(mazo1));
      localStorage.setItem('mazo2', JSON.stringify(mazo2));
    }

    function verJugador(n) {
      jugadorVisible = n;
      document.getElementById('jugador1').classList.remove('visible');
      document.getElementById('jugador2').classList.remove('visible');

      if (n === 1) {
        mostrarCartas('jugador1', mazo1, true);
      } else {
        mostrarCartas('jugador2', mazo2, true);
      }
    }

    function descartarCarta(jugadorId, index) {
      if (jugadorId === 'jugador1') {
        mazo1.splice(index, 1);
        localStorage.setItem('mazo1', JSON.stringify(mazo1));
      } else {
        mazo2.splice(index, 1);
        localStorage.setItem('mazo2', JSON.stringify(mazo2));
      }
      verJugador(jugadorVisible);
    }

    cargarCartas();
  </script>
</body>
</html>
