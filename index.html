<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baraja Repartida</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }
    h1 { text-align: center; }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }
    .players {
      display: flex;
      gap: 20px;
      justify-content: center;
    }
    .player {
      background: white;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      width: 45%;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 15px;
    }
    .card img {
      width: 100%;
      max-width: 180px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <h1>Baraja de Cartas</h1>
  <div class="buttons">
    <button onclick="repartirCartas()">Repartir Cartas</button>
    <button onclick="verJugador(1)">Ver Jugador 1</button>
    <button onclick="verJugador(2)">Ver Jugador 2</button>
  </div>
  <div class="players">
    <div class="player" id="jugador1">
      <h2>Jugador 1</h2>
    </div>
    <div class="player" id="jugador2">
      <h2>Jugador 2</h2>
    </div>
  </div>

  <script>
    let cartas = [];
    let mazo1 = [];
    let mazo2 = [];
    let jugadorVisible = 0;
    const dorso = "https://upload.wikimedia.org/wikipedia/commons/thumb/5/54/Card_back_01.svg/200px-Card_back_01.svg.png";

    async function cargarCartas() {
      const url = 'https://docs.google.com/spreadsheets/d/1n4N1HTVmJ8oK1-3jd7OrJGgxBDubIOHHbmDtAC72kAE/gviz/tq?tqx=out:csv';
      const response = await fetch(url);
      const data = await response.text();
      const rows = data.split('\n').slice(1);

      cartas = rows.map(row => {
        const parts = row.match(/("[^"]+"|[^,]+)/g);
        if (!parts || parts.length < 2) return null;

        const nombre = parts[0].replace(/(^\"|\"$)/g, '').trim();
        const imagen = parts[1].replace(/(^\"|\"$)/g, '').trim();
        return { nombre, imagen };
      }).filter(c => c && c.nombre && c.imagen);

      // Si hay partida guardada, cargarla
      const guardado1 = localStorage.getItem('mazo1');
      const guardado2 = localStorage.getItem('mazo2');
      if (guardado1 && guardado2) {
        mazo1 = JSON.parse(guardado1);
        mazo2 = JSON.parse(guardado2);
        mostrarCartas('jugador1', mazo1, false);
        mostrarCartas('jugador2', mazo2, false);
      }
    }

    function mostrarCartas(jugadorId, cartas, mostrar) {
      const contenedor = document.getElementById(jugadorId);
      contenedor.innerHTML = `<h2>${jugadorId === 'jugador1' ? 'Jugador 1' : 'Jugador 2'}</h2>`;
      cartas.forEach(carta => {
        const div = document.createElement('div');
        div.className = 'card';
        const imgSrc = mostrar ? carta.imagen : dorso;
        div.innerHTML = `
          <img src="${imgSrc}" alt="${carta.nombre}" onerror="this.src='${dorso}'">
          <p>${mostrar ? carta.nombre : ''}</p>
        `;
        contenedor.appendChild(div);
      });
    }

    function repartirCartas() {
      const barajadas = cartas.slice().sort(() => Math.random() - 0.5);
      const mitad = Math.ceil(barajadas.length / 2);
      mazo1 = barajadas.slice(0, mitad);
      mazo2 = barajadas.slice(mitad);
      jugadorVisible = 0;
      mostrarCartas('jugador1', mazo1, false);
      mostrarCartas('jugador2', mazo2, false);

      // Guardar partida
      localStorage.setItem('mazo1', JSON.stringify(mazo1));
      localStorage.setItem('mazo2', JSON.stringify(mazo2));
    }

    function verJugador(n) {
      jugadorVisible = n;
      mostrarCartas('jugador1', mazo1, n === 1);
      mostrarCartas('jugador2', mazo2, n === 2);
    }

    cargarCartas();
  </script>
</body>
</html>
